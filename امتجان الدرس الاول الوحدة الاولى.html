        let currentQuestionIndex = 0;

        let canAnswer = true;

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackMsg = document.getElementById('feedback-msg');
        const rationaleDetails = document.getElementById('rationale-details');
        const nextBtn = document.getElementById('next-btn');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const scoreText = document.getElementById('score-text');
        const difficultyBadge = document.getElementById('difficulty-badge');
        const bloomBadge = document.getElementById('bloom-badge');

        function loadQuestion() {
            canAnswer = true;
            const q = questions[currentQuestionIndex];
            
            // Update UI
            questionText.innerHTML = q.text;
            difficultyBadge.innerText = q.difficulty;
            bloomBadge.innerText = q.bloom;
            progressText.innerText = `السؤال ${currentQuestionIndex + 1} من ${questions.length}`;
            progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
            
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "text-right p-4 border-2 border-gray-200 rounded-xl hover:border-green-500 hover:bg-green-50 transition-all font-medium text-gray-700";
                btn.innerHTML = opt.text;
                btn.onclick = () => handleAnswer(index);
                optionsContainer.appendChild(btn);
            });

            feedbackArea.classList.add('hidden');
            nextBtn.classList.add('hidden');
            
            // Re-render MathJax
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function handleAnswer(index) {
            if (!canAnswer) return;
            canAnswer = false;

            const q = questions[currentQuestionIndex];
            const isCorrect = q.options[index].isCorrect;
            const buttons = optionsContainer.getElementsByTagName('button');

            if (isCorrect) {
                score++;
                scoreText.innerText = `النتيجة: ${score}`;
                buttons[index].classList.add('correct');
                feedbackArea.className = "p-4 rounded-lg mb-6 border-2 border-green-500 bg-green-50 block";
                feedbackMsg.innerText = "إجابة صحيحة! أحسنت.";
                feedbackMsg.className = "font-bold mb-2 text-green-700";
            } else {
                buttons[index].classList.add('incorrect');
                feedbackArea.className = "p-4 rounded-lg mb-6 border-2 border-red-500 bg-red-50 block";
                feedbackMsg.innerText = "إجابة خاطئة.";
                feedbackMsg.className = "font-bold mb-2 text-red-700";
                // Show correct answer
                q.options.forEach((opt, i) => {
                    if (opt.isCorrect) buttons[i].classList.add('correct');
                });
            }

            // Detailed Rationale
            rationaleDetails.innerHTML = `<p><strong>التفسير:</strong> ${q.options[index].rationale}</p>`;
            if (!isCorrect) {
                const correctOpt = q.options.find(o => o.isCorrect);
                rationaleDetails.innerHTML += `<p class="mt-2 text-green-700"><strong>لماذا الخيار الصحيح هو المطلوب؟</strong> ${correctOpt.rationale}</p>`;
            }

            nextBtn.classList.remove('hidden');
            if (window.MathJax) MathJax.typesetPromise();
        }

        nextBtn.onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showFinalResults();
            }
        };

        function showFinalResults() {
            document.getElementById('question-box').classList.add('hidden');
            const resultsArea = document.getElementById('results-area');
            resultsArea.classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score}/${questions.length}`;
            
            const comment = document.getElementById('performance-comment');
            const percentage = (score / questions.length) * 100;
            if (percentage >= 90) comment.innerText = "أداء مذهل! أنت خبير في علوم البيئة.";
            else if (percentage >= 75) comment.innerText = "أداء جيد جداً، لديك فهم عميق للمفاهيم.";
            else if (percentage >= 50) comment.innerText = "أداء جيد، ولكن تحتاج لمراجعة بعض المفاهيم المتقدمة.";
            else comment.innerText = "ننصح بإعادة قراءة الدرس والتركيز على العلاقات الكيميائية والآثار المناخية.";
        }

        loadQuestion();
